name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            silverfox-ecommerce/backend/package-lock.json
            silverfox-ecommerce/React/package-lock.json

      - name: Install dependencies
        run: npm run install-all

      - name: Build frontend
        run: npm run build-frontend

      - name: Run backend API tests
        working-directory: silverfox-ecommerce/backend
        run: npm test

      - name: Lint frontend
        working-directory: silverfox-ecommerce/React
        run: npm run lint
