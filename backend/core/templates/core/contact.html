{% extends 'core/base.html' %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:560px">
  <h1 class="sf-section-title mb-4">Contact</h1>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label">Name</label><input name="name" class="form-control" required style="border-radius:0"></div>
    <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required style="border-radius:0"></div>
    <div class="mb-3"><label class="form-label">Subject</label><input name="subject" class="form-control" style="border-radius:0"></div>
    <div class="mb-3"><label class="form-label">Message</label><textarea name="message" class="form-control" rows="4" required style="border-radius:0"></textarea></div>
    <button type="submit" class="btn sf-btn-gold w-100">Send Message</button>
  </form>
</div>
{% endblock %}
