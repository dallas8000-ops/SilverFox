{% extends 'core/base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px">
  <h1 class="sf-section-title mb-4">Create Account</h1>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label">Full name</label><input name="name" class="form-control" required style="border-radius:0"></div>
    <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required style="border-radius:0"></div>
    <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required minlength="6" style="border-radius:0"></div>
    <button type="submit" class="btn sf-btn-gold w-100">Create Account</button>
  </form>
</div>
{% endblock %}
