{% extends 'core/base.html' %}
{% block title %}Staff Login{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px">
  <h1 class="sf-section-title mb-4">Staff Login</h1>
  <p class="text-center small text-muted mb-3">Default: admin / admin</p>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" value="admin" required style="border-radius:0"></div>
    <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required style="border-radius:0"></div>
    <button type="submit" class="btn sf-btn-gold w-100">Sign In</button>
  </form>
</div>
{% endblock %}
