{% extends 'core/base.html' %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px">
  <h1 class="sf-section-title mb-4">Sign In</h1>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required style="border-radius:0"></div>
    <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required style="border-radius:0"></div>
    <button type="submit" class="btn sf-btn-gold w-100">Sign In</button>
  </form>
  <p class="text-center mt-3 small"><a href="{% url 'signup' %}">Create account</a></p>
</div>
{% endblock %}
